name: Gemini Real Provider Pilot

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  pilot:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'RUN_GEMINI_SINGLE_CALL_PILOT'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run single-call Gemini API pilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python single_call_pilot.py

      - name: Commit result readback
        if: always()
        run: |
          git config user.name "gemini-pilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f results/latest.json ]; then
            git add results/latest.json
            if git diff --cached --quiet; then
              echo "No result delta"
            else
              git commit -m "Record Gemini single-call pilot result"
              git push
            fi
          else
            echo "results/latest.json missing"
            exit 1
          fi
