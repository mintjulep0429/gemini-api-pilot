name: Gemini Real Provider Pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pilot.py'
      - 'run_pilot.py'
      - '.github/workflows/gemini-pilot.yml'
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  pilot:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.issue.title == 'RUN_GEMINI_REAL_PROVIDER_PILOT'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run 16-task Gemini API pilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_pilot.py

      - name: Commit result readback
        run: |
          git config user.name "gemini-pilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest.json
          if git diff --cached --quiet; then
            echo "No result delta"
          else
            git commit -m "Record Gemini real-provider pilot result"
            git push
          fi
